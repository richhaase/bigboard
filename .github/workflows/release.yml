name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: bigboard-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import signing certificate
        id: signing
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.QUILL_SIGN_P12 }}
          p12-password: ${{ secrets.QUILL_SIGN_PASSWORD }}
      - name: Prepare release credentials
        env:
          SIGNING_IDENTITIES: ${{ steps.signing.outputs.identities }}
          NOTARY_KEY: ${{ secrets.QUILL_NOTARY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          identity=$(jq -er '
            [.[] | select(.name | startswith("Developer ID Application:"))]
            | if length == 1 then .[0].hash
              else error("Expected one Developer ID Application identity")
              end
          ' <<< "$SIGNING_IDENTITIES")
          team=$(jq -er '
            .[]
            | select(.name | startswith("Developer ID Application:"))
            | .name
            | capture("\\((?<team>[A-Z0-9]{10})\\)$").team
          ' <<< "$SIGNING_IDENTITIES")
          key_path="$RUNNER_TEMP/bigboard-notary.p8"
          case "$NOTARY_KEY" in
            "-----BEGIN "*)
              printf '%s' "$NOTARY_KEY" > "$key_path"
              ;;
            *)
              printf '%s' "$NOTARY_KEY" | base64 --decode > "$key_path"
              ;;
          esac
          {
            echo "SIGNING_IDENTITY=$identity"
            echo "DEVELOPMENT_TEAM=$team"
            echo "NOTARY_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"
      - name: Archive, notarize, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIGBOARD_GITHUB_CLIENT_ID: ${{ vars.BIGBOARD_GITHUB_CLIENT_ID }}
          BIGBOARD_GITHUB_CLIENT_SECRET: ${{ secrets.BIGBOARD_GITHUB_CLIENT_SECRET }}
          BIGBOARD_GITHUB_APP_SLUG: ${{ vars.BIGBOARD_GITHUB_APP_SLUG }}
          NOTARY_KEY_ID: ${{ secrets.QUILL_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.QUILL_NOTARY_ISSUER }}
        run: bash scripts/release.sh "$RELEASE_TAG"
      - name: Remove notarization key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/bigboard-notary.p8"
      - name: Checkout Homebrew tap
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        uses: actions/checkout@v7
        with:
          repository: richhaase/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
      - name: Update Homebrew cask
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        run: |
          mkdir -p homebrew-tap/Casks
          bash scripts/homebrew-cask.sh "${RELEASE_TAG#v}" "build/Bigboard_${RELEASE_TAG#v}_darwin_universal.zip" > homebrew-tap/Casks/bigboard.rb
          ruby -c homebrew-tap/Casks/bigboard.rb
          git -C homebrew-tap config user.name github-actions[bot]
          git -C homebrew-tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C homebrew-tap add Casks/bigboard.rb
          if git -C homebrew-tap diff --cached --quiet; then exit 0; fi
          git -C homebrew-tap commit -m "Cask update for Bigboard version $RELEASE_TAG"
          git -C homebrew-tap push
