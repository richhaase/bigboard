name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

concurrency:
  group: bigboard-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release scripts
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'
      - name: Build, sign, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIGBOARD_GITHUB_CLIENT_ID: ${{ vars.BIGBOARD_GITHUB_CLIENT_ID }}
          BIGBOARD_GITHUB_CLIENT_SECRET: ${{ secrets.BIGBOARD_GITHUB_CLIENT_SECRET }}
          BIGBOARD_GITHUB_APP_SLUG: ${{ vars.BIGBOARD_GITHUB_APP_SLUG }}
          QUILL_SIGN_P12: ${{ secrets.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.QUILL_SIGN_PASSWORD }}
          QUILL_NOTARY_KEY: ${{ secrets.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.QUILL_NOTARY_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.QUILL_NOTARY_ISSUER }}
        run: bash scripts/release.sh "$RELEASE_TAG"
      - name: Checkout Homebrew tap
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        uses: actions/checkout@v7
        with:
          repository: richhaase/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
      - name: Update Homebrew cask
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        run: |
          mkdir -p homebrew-tap/Casks
          bash scripts/homebrew-cask.sh "${RELEASE_TAG#v}" "native/build/Bigboard_${RELEASE_TAG#v}_darwin_universal.zip" > homebrew-tap/Casks/bigboard.rb
          ruby -c homebrew-tap/Casks/bigboard.rb
          git -C homebrew-tap config user.name github-actions[bot]
          git -C homebrew-tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C homebrew-tap add Casks/bigboard.rb
          if git -C homebrew-tap diff --cached --quiet; then exit 0; fi
          git -C homebrew-tap commit -m "Cask update for Bigboard version $RELEASE_TAG"
          git -C homebrew-tap push
