name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Rust checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Extract the immutable Go reference
        run: |
          mkdir -p "$RUNNER_TEMP/bigboard-go"
          git archive a0acd7677837fff81eb10d31afc3a6b030362009 | tar -x -C "$RUNNER_TEMP/bigboard-go"
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ runner.temp }}/bigboard-go/go.mod
          cache: false
      - name: Build the Go reference and compare behavior
        run: |
          (cd "$RUNNER_TEMP/bigboard-go" && go build -o "$RUNNER_TEMP/go-bigboard" ./cmd/bigboard)
          python3 scripts/check_parity.py --reference "$RUNNER_TEMP/go-bigboard"
