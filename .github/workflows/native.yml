name: Native Swift
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Verify macOS SDK
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          test "${sdk%%.*}" -ge 26
      - name: Test and build application
        run: make check
