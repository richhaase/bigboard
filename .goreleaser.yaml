version: 2

project_name: bigboard

builds:
  - id: bigboard
    skip: true

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: desktop/build/bin/Bigboard_{{ .Version }}_darwin_universal.zip

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^style:'
      - '^refactor:'
      - '^perf:'
      - '^ci:'
  groups:
    - title: Features
      regexp: '^feat'
    - title: Bug Fixes
      regexp: '^fix'
    - title: Security
      regexp: '^sec'
    - title: Breaking Changes
      regexp: '^.*!:'
    - title: Other Changes

release:
  github:
    owner: richhaase
    name: bigboard
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
  extra_files:
    - glob: desktop/build/bin/Bigboard_{{ .Version }}_darwin_universal.zip
  header: |
    ## Big Board v{{.Version}}

    Bigboard for macOS: explore work areas, contributors, and commit evidence across GitHub repositories.

    ### Upgrading from the terminal version
    This is a GUI-only macOS application. Homebrew upgrades replace the terminal command with Bigboard.app.
    Linux downloads and the `bigboard` command, including `bigboard --export`, are no longer distributed.
    Use Export JSON on the Contributors board. Existing configuration, repository caches, and bookmarks are reused.
  footer: |
    ---

    **Full Changelog**: https://github.com/richhaase/bigboard/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## Installation

    ### Homebrew
    ```bash
    brew install --cask richhaase/tap/bigboard
    ```

    ### Direct Download
    Download the universal macOS archive, extract it, and move Bigboard.app to Applications.
    Git and an authenticated GitHub CLI are required for live data.

announce:
  skip: true
