[package]
name = "bigboard"
version = "0.7.0"
edition = "2024"
description = "A cyberpunk terminal dashboard for contributor activity across Git repositories"
license = "MIT"
repository = "https://github.com/richhaase/bigboard"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal-colorsaurus = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
glob = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
